plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    // Common Protection API: how Fabric claim mods (Open Parties and Claims, FTB Chunks, Flan, GOML...) answer
    // "may this player build here?". Bundled in the jar.
    maven {
        name = 'Nucleoid'
        url = uri('https://maven.nucleoid.xyz')
        content {
            includeGroup('eu.pb4')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    include(modImplementation("eu.pb4:common-protection-api:1.0.0"))
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // One mixins json serves both loaders; Forge's refmap has this name too.
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // QA client: joins a server on localhost:25565 straight away (see tools/qa/).
        qaClient {
            client()
            setConfigName('Fabric QA Client')
            ideConfigGenerated(false)
            runDir('runs/client')
            programArgs('--quickPlayMultiplayer', 'localhost:25565', '--username', 'Builder', '--width', '1920', '--height', '1080')
        }
    }
}
